# ─────────────────────────────────────────────────────────────
# 채용공고 매칭 설정 파일
# 코드는 건드리지 않고 이 파일만 고쳐서 기준을 바꿀 수 있습니다.
# 고친 뒤에는 앱 화면에서 [다시 채점] 버튼을 누르면 반영됩니다.
# ─────────────────────────────────────────────────────────────

# 내 경력 연수 (공고의 경력 조건과 비교할 때 씀)
my_years: 11

# 거리 계산의 기준점 — 공개 저장소라 시 단위 대략 위치(용인시청)만 적어 둠
# 실제 집 위치는 .env 파일의 HOME_LAT / HOME_LON / HOME_NAME에 넣으면 그걸 우선 씀
home:
  name: 용인시청(대략)
  lat: 37.2411
  lon: 127.1776

# ─────────────────────────────────────────────────────────────
# 지역 목록
# match: 사람인 공고의 지역 이름에 이 글자가 들어 있으면 해당 지역으로 봄
# 위도·경도는 각 지역 중심(또는 주요 업무지구)의 대략 좌표
# 여기에 없는 지역의 공고는 화면에 나오지 않습니다 (재택·원격 공고는 예외)
# ─────────────────────────────────────────────────────────────
regions:
  - {name: 용인 기흥, match: [용인시 기흥구], lat: 37.2750, lon: 127.1160}
  - {name: 용인 처인, match: [용인시 처인구], lat: 37.2340, lon: 127.2010}
  - {name: 용인 수지, match: [용인시 수지구], lat: 37.3220, lon: 127.0980}
  - {name: 용인(구 미표기), match: [용인시], lat: 37.2750, lon: 127.1160}
  - {name: 수원, match: [수원시], lat: 37.2636, lon: 127.0286}
  - {name: 화성(동탄 기준), match: [화성시], lat: 37.2010, lon: 127.0740}
  - {name: 오산, match: [오산시], lat: 37.1499, lon: 127.0775}
  - {name: 성남 분당(판교), match: [성남시 분당구], lat: 37.3826, lon: 127.1189}
  - {name: 성남 수정·중원, match: [성남시 수정구, 성남시 중원구, 성남시], lat: 37.4400, lon: 127.1400}
  - {name: 의왕, match: [의왕시], lat: 37.3447, lon: 126.9683}
  - {name: 군포, match: [군포시], lat: 37.3617, lon: 126.9352}
  - {name: 안양, match: [안양시], lat: 37.3943, lon: 126.9568}
  - {name: 송파, match: [서울 송파구, 송파구], lat: 37.5145, lon: 127.1059}
  - {name: 서초, match: [서울 서초구, 서초구], lat: 37.4837, lon: 127.0324}
  - {name: 강남, match: [서울 강남구, 강남구], lat: 37.5172, lon: 127.0473}
  - {name: 평택, match: [평택시], lat: 36.9921, lon: 127.1129}

# 이 글자가 공고 제목·지역에 있으면 지역과 상관없이 포함 (거리 0으로 표시)
remote_words: [재택, 원격, 리모트, remote]

# ─────────────────────────────────────────────────────────────
# 사람인에서 검색할 범위
# loc_mcd: 1차 지역 코드 (101000 서울, 102000 경기) — 넓게 받아 온 뒤 위 지역 목록으로 거름
# 검색어 1개 = 호출 1회 (하루 한도 500회)
# ─────────────────────────────────────────────────────────────
search:
  loc_mcd: "101000,102000"
  count: 110          # 한 번에 받을 공고 수 (사람인 최대 110)
  queries:
    career: [LC-MS/MS, 바이오분석, 약동학, DMPK, 임상약리, 생동성, 약물분석]
    ai: [AI 신약개발, 신약 AI, 계량약리, 약물 모델링, 바이오인포매틱스]

# ─────────────────────────────────────────────────────────────
# 채점 기준표
# 묶음(group)마다 weight(무게)가 있고, 묶음 안의 단어가 공고에 나오면 점수를 받음
#   - 한 묶음에서 2개 이상 맞으면 그 묶음 점수를 다 받고, 1개면 절반
# gaps: 공고에 나오면 "부족한 점"으로 보여 주고 점수를 조금 깎는 단어
# exclude: 나오면 크게 깎는 단어 (내 방향과 거리가 먼 직무)
# 영문 대소문자, 띄어쓰기, 하이픈(-)은 무시하고 비교합니다
# ─────────────────────────────────────────────────────────────
tracks:
  career:
    label: 경력 직결
    min_score: 25        # 이 점수 미만은 탭에 안 보임 (화면에서 조절 가능)
    groups:
      - name: 핵심 기술
        weight: 30
        terms: [LC-MS/MS, LCMS, LC-MS, 질량분석, 생체시료, 바이오분석, bioanalysis, bioanalytical, 분석법 개발, 밸리데이션, validation, 시료분석, 약물분석]
      - name: 시험 분야
        weight: 25
        terms: [PK, TK, 약동학, 독성동태, DMPK, ADME, 생동성, BE, 임상 1상, 비임상, 조직분포, 대사체, 대사안정성]
      - name: 규제·품질
        weight: 15
        terms: [GLP, GCLP, GMP, ICH M10, 식약처, 시험책임자, SD, CTD, SOP, 데이터 무결성]
      - name: 물질
        weight: 10
        terms: [펩타이드, peptide, ASO, 안티센스, mRNA, 올리고, 저분자, 신규 모달리티]
      - name: 직무명
        weight: 20
        terms: [책임연구원, 선임연구원, 분석센터, CRO, 임상약리, 약물동태, 분석팀, 팀장, PL]
    gaps: [박사, Ph.D, ELISA, LBA, 면역분석, Phoenix WinNonlin]
    exclude: [영업, 생산직, 단순 QC, 화장품 영업, 제조 오퍼레이터]

  ai:
    label: 신약 AI
    min_score: 20
    groups:
      - name: 신약·약리 도메인
        weight: 30
        terms: [신약, 신약개발, drug discovery, 약물, PK, PD, 약동학, 계량약리, pharmacometrics, PopPK, 집단약동학, 임상약리, MIPD, 정밀투약, ADME, 약물상호작용, DDI]
      - name: AI·데이터 기술
        weight: 30
        terms: [AI, 인공지능, 머신러닝, machine learning, 딥러닝, deep learning, 데이터 분석, 데이터분석, 예측 모델, 모델링, LLM, RAG, 생성형]
      - name: 개발 도구
        weight: 20
        terms: [Python, 파이썬, R, Streamlit, SQL, Supabase, Pandas, scikit-learn, 시각화, Power BI, QGIS, GIS]
      - name: 바이오 데이터
        weight: 20
        terms: [바이오인포매틱스, 생물정보, bioinformatics, 오믹스, omics, 유전체, 멀티오믹스, 임상 데이터, 의료 데이터, 헬스케어]
    gaps: [박사, Ph.D, PyTorch 실무, C++, Kubernetes, MLOps, 분자동역학, 구조생물학, 3년 이상 개발]
    exclude: [영업, 마케팅, 생산직]

# 공고의 경력 조건 처리
experience:
  junior_only_penalty: 30   # "신입만" 공고에서 깎는 점수 (경력 직결 탭)
  junior_only_penalty_ai: 5 # 신약 AI 탭에서는 전환 중이라 적게 깎음
  too_low_max_penalty: 15   # 경력 상한이 내 연수보다 한참 낮을 때 (예: 최대 5년)
